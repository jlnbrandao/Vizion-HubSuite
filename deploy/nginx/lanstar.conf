# Lanstar — reverse proxy + SPA
# Install: /etc/nginx/sites-available/lanstar.conf → sites-enabled
#
# Multi-tenant: resolve tenant from Host subdomain (first label), e.g.
#   universe.lanstar.com.br  /  bigbang.<server-ip>
# Prefer: server_name *.lanstar.com.br;  (wildcard DNS / TLS as needed)
# Host is forwarded to the API so TenantMiddleware can bind RLS context.

upstream lanstar_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # server_name *.lanstar.com.br lanstar.com.br;
    server_name _;

    root /opt/lanstar/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # Security headers (basic)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API → uvicorn
    location /api/ {
        proxy_pass http://lanstar_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health (útil para probes)
    location = /health {
        proxy_pass http://lanstar_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Assets com cache longo
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
