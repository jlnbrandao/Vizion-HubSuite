# Vizion H-Suite — extra vhost on the shared vizion-g host.
# Does NOT use default_server and does NOT bind :80/:443 (those belong to openvizion.com).
# Access: http://<server-ip>:8088  or  http://universe.<server-ip>:8088

upstream vizion_h_api {
    server 127.0.0.1:8010;
    keepalive 32;
}

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    root /opt/vizion-h-suite/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://vizion_h_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://vizion_h_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
