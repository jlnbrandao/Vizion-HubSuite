# Lanstar app (VPS 134.209.122.250) behind Cloudflare / vizion-g TLS.
# Exact server_name beats the Vizion-G tenant regex and HubSuite vhosts.

upstream lanstar_origin {
    server 134.209.122.250:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lanstar.openvizion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lanstar.openvizion.com;

    ssl_certificate /etc/letsencrypt/live/openvizion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvizion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location / {
        proxy_pass http://lanstar_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
