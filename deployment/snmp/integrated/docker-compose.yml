services:
  snmp-api:
    image: openvizion/snmp-api:local
    build:
      context: ../../..
      dockerfile: products/snmp/backend/Dockerfile
    environment:
      DEPLOYMENT_MODE: integrated
      PLATFORM_ADAPTER: hub
      PLATFORM_CORE_URL: http://platform-core:8000
    ports:
      - "8300:8000"
    extra_hosts:
      - "platform-core:host-gateway"
