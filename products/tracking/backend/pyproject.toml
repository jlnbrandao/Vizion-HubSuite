[project]
name = "openvizion-tracking"
version = "0.1.0"
description = "OpenVizion Tracking — distributable product (standalone or Hub-integrated)."
requires-python = ">=3.13"
dependencies = [
    "openvizion-kernel",
    "openvizion-events",
    "openvizion-observability",
    "openvizion-contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.0.1",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
kafka = [
    "aiokafka>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tracking"]

[tool.hatch.build.targets.wheel.force-include]
"src/tracking" = "tracking"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "src",
    "../../../packages/kernel/src",
    "../../../packages/events/src",
    "../../../packages/observability/src",
    "../../../packages/contracts/src",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
