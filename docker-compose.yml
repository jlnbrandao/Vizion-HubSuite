services:
  postgres:
    image: postgres:16-alpine
    container_name: vizion-postgres
    environment:
      POSTGRES_USER: vizion
      POSTGRES_PASSWORD: vizion
      POSTGRES_DB: vizion
    # Host-only publish: never expose DB/cache on the public interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizion -d vizion"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vizion-redis
    # Host-only publish: never expose Redis on the public interface.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enterprise-template-api
    container_name: vizion-api
    environment:
      APP_NAME: Vizion
      APP_ENV: development
      APP_DEBUG: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # App DB role (FORCE RLS). Defaults are for local compose only — rotate in production.
      DATABASE_URL: postgresql+asyncpg://vizion_app:vizion_app@postgres:5432/vizion
      DATABASE_MIGRATE_URL: postgresql+asyncpg://vizion:vizion@postgres:5432/vizion
      REDIS_URL: redis://redis:6379/0
      # PyJWT HS256 — use a ≥32 char secret outside development
      JWT_SECRET_KEY: change-me-in-production-use-long-random-string
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      AUTH_RATE_LIMIT_REQUESTS: "20"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
      ALLOWED_TENANT_BASE_DOMAINS: localhost,openvizion.com,openvizion.local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vizion-frontend
    ports:
      - "9000:80"
    depends_on:
      api:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    # Share the API image so seed never drifts from permission_codes / providers.
    image: enterprise-template-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vizion-seed
    environment:
      # Seed only runs with demo password when APP_ENV=development (or SEED_ALLOW_INSECURE=true)
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://vizion:vizion@postgres:5432/vizion
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-production-use-long-random-string
      ALLOWED_TENANT_BASE_DOMAINS: localhost,openvizion.com,openvizion.local
    entrypoint: ["python", "-m", "scripts.seed"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
