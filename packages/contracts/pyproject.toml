[project]
name = "openvizion-contracts"
version = "0.1.0"
description = "Versioned DTOs between Platform Core and distributable products."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvizion"]
only-include = ["src/openvizion/contracts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
